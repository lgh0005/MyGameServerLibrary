syntax = "proto3";
package Protobuf;

import "Enum.proto";
import "Types.proto";

message ObjectInfo
{
	uint64 objectID = 1;
	OBJECT_TYPE objectType = 2;
	OBJECT_STATE_TYPE state = 3;
	Vec2 position = 4;
    Vec2 velocity = 5;
	bool grounded = 6;
    FACING_TYPE facing = 7;
    WEAPON_TYPE weapon = 8;
    Color color = 9;
}