syntax = "proto3";
package Protobuf;

import "Enum.proto";
import "Struct.proto";

message C_EnterGame
{

}

message S_EnterGame
{
	bool success = 1;
	ObjectInfo player = 2;
}

message C_Move
{
    DIR_TYPE dir = 1;
    bool running = 2;
}

message C_Jump
{

}

message C_ChangeWeapon
{
    WEAPON_TYPE weapon = 1;
}

message C_Attack
{

}

message S_Spawn
{
    repeated ObjectInfo objects = 1;
}

message S_SyncObjects
{
    repeated ObjectInfo objects = 1;
}